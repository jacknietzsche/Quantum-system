[project]
name = "a-stock-quant"
version = "15.0.0"
description = "A股量化交易系统 — 选股、回测、风控一体化平台"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "backtrader>=1.9.78",
    "akshare>=1.12.0",
    "baostock>=0.8.8",
    "efinance>=5.0.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "quantstats>=0.0.62",
    "schedule>=1.2.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "I"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
