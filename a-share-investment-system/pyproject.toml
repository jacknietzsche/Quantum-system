# =============================================================================
# A股智能投资系统 — Python 项目配置 (pyproject.toml)
# =============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-investment-system"
version = "1.0.0"
description = "A股量化投资决策系统 — 多Agent多Skill协同框架"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=1.6.0",

    # 数据验证与配置
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # 数据库
    "sqlalchemy>=2.0.0",

    # 数据处理
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",

    # HTTP 客户端
    "requests>=2.31.0",
    "httpx>=0.27.0",

    # A股数据源
    "akshare>=1.14.0",
    "tushare>=1.4.0",
    "baostock>=0.8.0",
    "efinance>=0.5.0",
    "yfinance>=0.2.0",
    "easyquotation>=0.7.0",

    # LLM / Agent 框架
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",

    # 工具与解析
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "html5lib>=1.1",
    "jieba>=0.42.0",
    "rich>=13.0.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",

    # 任务调度
    "apscheduler>=3.10.0",
    "chinese-calendar>=1.9.0",

    # 其他
    "psutil>=5.9.0",
    "PyJWT>=2.8.0",
    "stockstats>=0.6.0",
    "plotly>=5.18.0",

    # Python 3.10 兼容 (tomllib 为 3.11+ 内置)
    "tomli>=2.0.1",
]

[project.optional-dependencies]
google = ["google-generativeai>=0.7.0"]
ui = ["streamlit>=1.28.0", "chainlit>=2.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-timeout>=2.2.0",
    "ruff>=0.11.0",
    "mypy>=1.15",
    "black>=24.0",
    "isort>=6.0",
    "pre-commit>=4.0",
    "bandit>=1.8",
    "types-PyYAML",
    "types-requests",
    "pandas-stubs",
]

[project.scripts]
ashare-x = "main:main"
ashare-x-server = "server:main"

[tool.setuptools.packages.find]
include = ["api*", "core*", "services*", "providers*", "shared*", "workflows*", "graph_v2*", "agents_v2*", "llm_clients*", "config*", "cli*"]
exclude = ["tests*", "frontend*", "docs*", "data*", "logs*", "reports*", "skills*"]

# ── Ruff: Linting + Formatting ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "data/",
    "logs/",
    "reports/",
]

[tool.ruff.lint]
select = [
    # pyflakes (基础错误检测)
    "F",
    # pycodestyle (代码风格)
    "E", "W",
    # isort (导入排序) — 由 isort hook 处理
    "I",
    # flake8-bugbear (常见错误)
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-simplify (简化代码)
    "SIM",
    # flake8-return (返回语句)
    "RET",
    # pylint (深度检查)
    "PL",
    # flake8-eradicate (注释掉的代码)
    "ERA",
    # flake8-no-pep420 (隐式命名空间包)
    "INP",
    # flake8-implicit-str-concat
    "ISC",
    # Ruff 特有规则
    "RUF",
    # flake8-bandit (安全)
    "S",
    # flake8-pie
    "PIE",
    # pyupgrade (提示升级语法)
    "UP",
]

ignore = [
    # 允许一行的 docstring (如 "TODO: xxx")
    "B018",
    # 允许 lambda 赋值（策略引擎中常见）
    "E731",
    # 允许在 try/except 中使用 print（数据源降级日志）
    "S110",
    # pytest fixtures 保留
    "PLR0913",  # too-many-arguments — 投资数据函数参数多
    "PLR2004",  # magic-value-comparison — 金融量化阈值是业内常识
    # 量化/工作流节点天然复杂，强制拆分反而降低可读性
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
    # 中文项目允许全角标点出现在字符串/注释/文档字符串中
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许更多灵活性
"tests/**/*.py" = [
    "S101",    # assert — 测试必须用
    "PLR2004", # 魔法数字
    "S106",    # 硬编码密码（测试fixture）
    "PLC0415", # 测试中局部导入避免循环依赖
    "E501",    # 测试mock链长行
    "E402",    # 测试按需/条件导入
    "B007",    # 未使用循环变量（测试可读性优先）
    "B905",    # zip strict 参数
    "E741",    # 单字母变量 l
    "F841",    # 未使用局部变量（测试中间结果）
    "PLW0108", # 不必要lambda（测试mock）
    "RUF015",  # next 替代单元素切片
    "RUF059",  # 未使用解包变量
    "SIM117",  # 嵌套 with 语句
    "E712",    # 测试布尔比较可读性
    "S311",    # 测试数据使用 random 无需加密安全
    "ERA001",  # 测试中的注释代码可保留
    "C408",    # dict() 与 {} 在测试中可读性优先
    "SIM105",  # try/except/pass 在测试中可接受
    "PLW0603", # 测试脚本允许 global 更新计数器
    "PLR1714", # 测试中的显式比较可读性优先
]
"trading-skills/convert_skills.py" = [
    "E501",   # 技能描述长字符串保持可读性
    "RUF001", # 允许中文全角冒号
]
"v2_cli.py" = [
    "PLC0415", # CLI 命令按需导入以缩短启动时间
]
"workflows/**/*.py" = [
    "PLC0415", # 工作流节点大量局部导入以避免循环依赖
    "I001",    # 旧文件导入顺序暂不强制
]
"workflows/stubs.py" = [
    "RUF012",  # 风险象限配置作为类级常量可接受
]
# 路由/API层、CLI、agents_v2 大量局部导入以避免循环依赖+缩短启动时间
"api/routes/**/*.py" = ["PLC0415", "E501", "E402"]
"cli/**/*.py" = ["PLC0415", "E501", "E402"]
"agents_v2/**/*.py" = ["PLC0415", "E501", "E402"]
"graph_v2/**/*.py" = ["PLC0415", "E501", "E402"]
"providers/**/*.py" = ["PLC0415", "E501", "E402"]
"services/**/*.py" = ["PLC0415", "E501", "E402"]
"core/**/*.py" = ["PLC0415", "E501", "E402"]
"llm_clients/**/*.py" = ["PLC0415", "E501", "E402"]
"shared/**/*.py" = ["PLC0415", "E501", "E402"]
"services_v2/**/*.py" = ["PLC0415", "E501", "E402"]
"config/*.py" = ["E402", "E501"]
# 脚本文件 -- HTML 模板字符串, E501 允许
"scripts/*.py" = [
    "T201",
    "E501",
]
# 根目录 _skills.py — 适配器内大量局部导入以避免循环依赖
"_skills.py" = [
    "PLC0415",
    "E501",
    "E402",
]
# 主入口文件 -- CLI 输出 + E501
"main.py" = [
    "T201",
    "E501",
    "E402",
    "PLC0415",
]
"workflow.py" = [
    "ERA",
    "E501",
]
"launch.py" = [
    "S602", "S607", "S310", "S112",
    "ERA",
    "E501",
    "PLC0415",
]
"server.py" = ["E501", "E402", "PLC0415"]
"skills.py" = ["E501"]
"services/data_bus.py" = ["PLC0415"]
"decision_review.py" = ["ERA", "E501", "PLC0415"]
"workflows/nodes/_shared.py" = ["E501"]
"workflows/nodes/node_generate_final_report.py" = ["E501"]
"workflows/nodes/runner.py" = ["E501"]
"workflows/nodes/node_risk_control_audit.py" = ["ERA", "E501"]
"workflows/nodes/node_generate_recommendations.py" = ["E501"]
"workflows/nodes/node_fetch_global_data.py" = ["E501"]
"workflows/nodes/node_push_notification.py" = ["ERA", "E501"]
"workflows/nodes/node_fincept_master_verify.py" = ["ERA", "E501"]
"workflows/nodes/node_multi_model_vote.py" = ["ERA", "E501"]
"workflows/nodes/node_skill_analysis_parallel.py" = ["ERA", "E501"]
".fix_ruff*.py" = ["ERA", "SIM", "PL", "B007", "PIE", "PLW", "F841", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# ── MyPy: 类型检查 ───────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
disallow_untyped_defs = false       # 渐进式 — 逐步严格
disallow_incomplete_defs = false    # 渐进式
check_untyped_defs = false          # 代码库尚未完全类型化，先检查显式标注的代码
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "akshare.*",
    "efinance.*",
    "baostock.*",
    "tushare.*",
    "easyquotation.*",
    "yfinance.*",
    "sqlalchemy.*",
    "socksio",
    "pandas",
    "numpy",
    "scipy.*",
    "requests",
    "yaml",
    "tomli",
    "zzshare.*",
    "langchain_anthropic",
    "langchain_google_genai",
    "google.generativeai",
    "chinese_calendar",
    "jieba",
    "rank_bm25",
    "markdown",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "services_v2.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# 以下模块为实验性/遗留代码，类型错误较多，暂不强制检查
[[tool.mypy.overrides]]
module = [
    "workflows.*",
    "workflows.nodes.*",
    "graph_v2.*",
    "agents_v2.*",
    "llm_clients.*",
    "services.quant_agent.*",
    "services.screening.*",
    "services.backtest_loop",
    "services.master_agents",
    "services.agent_workflow",
    "services.llm_router",
    "services.trading_orchestrator",
    "services.indicator_refresher",
    "services.market",
    "services.data_bus",
    "services.data_mgmt",
    "services.data_initializer",
    "services.data_explorer",
    "services.agents.*",
    "providers.market_data",
    "providers.source_base",
    "providers.sources.*",
    "core.graph.workflow",
    "services.workflow",
    "decision_review",
    "_skills",
    "tests.unit.test_workflow_nodes",
]
ignore_errors = true

# ── Pytest: 测试配置 ─────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=40",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "data: marks tests that fetch real data",
]

# ── Coverage ──────────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "data/*",
    "logs/*",
    "reports/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ── Isort: 导入排序 ──────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["a_share_investment_system"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# ── Bandit: 安全检查 ─────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "data", "logs", "reports", ".venv", "venv"]
skips = ["B101", "B601"]  # B101: assert (测试中需要), B601: paramiko
severity = "medium"
