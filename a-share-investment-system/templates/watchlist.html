<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自选股管理 - A股智能投资系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f6fa; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .card { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .table-hover tbody tr:hover { background-color: rgba(13,110,253,.05); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-graph-up"></i> A股智能投资系统</a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> 返回仪表盘</a>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <div class="row mb-3">
            <div class="col-6">
                <h3><i class="bi bi-star"></i> 自选股管理</h3>
            </div>
            <div class="col-6 text-end">
                <button class="btn btn-primary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="watchlist-table">
                        <thead>
                            <tr>
                                <th>代码</th>
                                <th>名称</th>
                                <th>现价</th>
                                <th>涨跌幅%</th>
                                <th>PE</th>
                                <th>RSI</th>
                                <th>趋势</th>
                            </tr>
                        </thead>
                        <tbody id="watchlist-tbody">
                            <tr><td colspan="7" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        async function loadWatchlist() {
            const response = await fetch(`${API_BASE}/api/watchlist`);
            const data = await response.json();
            
            const tbody = document.getElementById('watchlist-tbody');
            if (data.status === 'ok' && data.data) {
                let html = '';
                data.data.forEach(item => {
                    const changeClass = item.change_pct >= 0 ? 'text-danger' : 'text-success';
                    html += `<tr>
                        <td><strong>${item.stock_code}</strong></td>
                        <td>${item.stock_name}</td>
                        <td>${item.latest_price || '--'}</td>
                        <td class="${changeClass}">${item.change_pct || '--'}%</td>
                        <td>${item.pe_ratio || '--'}</td>
                        <td>${item.rsi || '--'}</td>
                        <td>${item.trend || '--'}</td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            }
        }
        
        loadWatchlist();
        setInterval(loadWatchlist, 30000); // 30秒刷新一次
    </script>
</body>
</html>
